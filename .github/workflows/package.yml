name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: release
            build_directory: build/release
            configuration: ""
          - os: macos-14
            preset: release
            build_directory: build/release
            configuration: ""
          - os: windows-2022
            preset: release-windows
            build_directory: build/release-windows
            configuration: Release
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_COMMIT: 16c71a39e5a0fc0bdb3fad03beef8f38ee00ee3b
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --detach $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install
        if: matrix.configuration == ''
        run: cmake --install ${{ matrix.build_directory }} --prefix stage

      - name: Install on Windows
        if: matrix.configuration != ''
        run: cmake --install ${{ matrix.build_directory }} --config ${{ matrix.configuration }} --prefix stage

      - name: Smoke test installed application
        run: cmake -DINSTALL_PREFIX=stage -P cmake/SmokeInstall.cmake

      - name: Package
        if: matrix.configuration == ''
        run: cpack --config ${{ matrix.build_directory }}/CPackConfig.cmake

      - name: Package on Windows
        if: matrix.configuration != ''
        run: cpack --config ${{ matrix.build_directory }}/CPackConfig.cmake -C ${{ matrix.configuration }}

      - name: Smoke test package
        run: cmake -DPACKAGE_DIRECTORY=${{ matrix.build_directory }}/package -P cmake/SmokePackage.cmake

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cpp-release-lab-${{ matrix.os }}
          path: |
            ${{ matrix.build_directory }}/package/*.zip
            ${{ matrix.build_directory }}/package/*.tar.gz
          if-no-files-found: error
          overwrite: true
